#{% set version_number = version.split('+')[0] %}
# change the build number by hand if you want to rebuild the package
context:
  build_number: 0
  name: ${{ load_from_file("pyproject.toml").project.name }}
  version: ${{ load_from_file("pyproject.toml").tool.pixi.package.version }}
  homepage: ${{ load_from_file("pyproject.toml").project.urls.homepage }}
  description: ${{ load_from_file("pyproject.toml").project.description }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..


build:
  noarch: python
  number: ${{ build_number }}

requirements:
  host:
    - python
    - versioningit
    - setuptools>=42
    - wheel

  build:
    - setuptools>=42
    - versioningit

  run:
    - numpy
    - matplotlib
    - h5py

tests:
  - python:
      imports:
        - histogram

about:
  homepage: ${{ homepage }}
  summary: ${{ description }}
  #license: BSD
